[build]
builder = "DOCKERFILE"
# Self-contained compile when Railway builds from this repo (scratch path).
# Fast path: set control-plane MACHINE_SOURCE_IMAGE=docker.io/<user>/reavion-desktop:main
dockerfilePath = "Dockerfile.vendor"

[deploy]
# Desktop + driver + edge need a few minutes on first boot.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
