name: Release desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  repository_dispatch:
    types: [reavion-xfce-release, reavion-driver-release]
  workflow_dispatch:
    inputs:
      xfce_tag:
        description: reavion-xfce tag
        default: main
      driver_version:
        description: reavion-driver tag
        default: main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: helderperez-dev/reavion-desktop

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: ver
        run: |
          XFCE_TAG="${{ github.event.client_payload.xfce_tag || inputs.xfce_tag || 'main' }}"
          DRIVER_VERSION="${{ github.event.client_payload.driver_version || inputs.driver_version || 'main' }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            DESKTOP_TAG="${GITHUB_REF#refs/tags/}"
          else
            DESKTOP_TAG="main"
          fi
          SHA_TAG="sha-${GITHUB_SHA::12}"
          echo "xfce_tag=${XFCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "driver_version=${DRIVER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "desktop_tag=${DESKTOP_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "desktop_base=${REGISTRY}/helderperez-dev/reavion-xfce:${XFCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "driver_image=${REGISTRY}/helderperez-dev/reavion-driver:${DRIVER_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Use the docker driver so local vendor-built base tags are visible to subsequent builds.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Choose Dockerfile (GHCR bases vs vendor compile)
        id: df
        run: |
          set -euo pipefail
          BASE="${{ steps.ver.outputs.desktop_base }}"
          DRIVER="${{ steps.ver.outputs.driver_image }}"
          RESOLVED_BASE="$BASE"

          if docker pull "$BASE"; then
            echo "xfce base available from GHCR"
          else
            echo "GHCR xfce unavailable (private ACL) — building from vendor/reavion-xfce"
            test -f vendor/reavion-xfce/Dockerfile
            docker build -t "reavion/xfce:ci" -f vendor/reavion-xfce/Dockerfile vendor/reavion-xfce
            RESOLVED_BASE="reavion/xfce:ci"
          fi
          echo "desktop_base=${RESOLVED_BASE}" >> "$GITHUB_OUTPUT"

          if docker pull "$DRIVER"; then
            echo "file=Dockerfile" >> "$GITHUB_OUTPUT"
            echo "driver_image=${DRIVER}" >> "$GITHUB_OUTPUT"
            echo "Using prebuilt GHCR driver"
          else
            echo "file=Dockerfile.vendor" >> "$GITHUB_OUTPUT"
            echo "driver_image=${DRIVER}" >> "$GITHUB_OUTPUT"
            echo "Driver image missing — compiling from vendor/reavion-driver"
            test -f vendor/reavion-driver/rust/Cargo.toml
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: steps.df.outputs.skip != 'true'
        with:
          context: .
          file: ${{ steps.df.outputs.file }}
          push: true
          platforms: linux/amd64
          build-args: |
            DESKTOP_BASE=${{ steps.df.outputs.desktop_base }}
            DRIVER_IMAGE=${{ steps.df.outputs.driver_image }}
            REAVION_DRIVER_VERSION=${{ steps.ver.outputs.driver_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.desktop_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Make reavion-desktop publicly pullable (Railway)
        if: steps.df.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for url in             "https://api.github.com/user/packages/container/reavion-desktop/visibility"             "https://api.github.com/orgs/helderperez-dev/packages/container/reavion-desktop/visibility"; do
            if curl -fsS -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GH_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "$url"               -d '{"visibility":"public"}'; then
              echo "Set reavion-desktop visibility=public"
              exit 0
            fi
          done
          echo "::warning::Could not set reavion-desktop public — set Package visibility manually for Railway pulls"
