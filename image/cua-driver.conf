[program:cua-driver]
command=/usr/local/bin/start-cua-driver.sh
user=cua
directory=/home/cua
environment=HOME="/home/cua",USER="cua",DISPLAY=":1",CUA_DRIVER_RS_TELEMETRY_ENABLED="0"
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/supervisor/cua-driver.log
stderr_logfile=/var/log/supervisor/cua-driver.error.log
priority=40
