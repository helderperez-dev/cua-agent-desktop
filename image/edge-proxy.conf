[program:edge-proxy]
command=/usr/local/bin/start-edge-proxy.sh
user=root
environment=PORT="%(ENV_PORT)s",HOME="/root",PATH="/usr/local/bin:/usr/bin:/bin"
autorestart=true
startsecs=3
startretries=20
stdout_logfile=/var/log/supervisor/edge-proxy.log
stderr_logfile=/var/log/supervisor/edge-proxy.error.log
priority=60
