[program:mcp-gateway]
command=/usr/local/bin/start-mcp-gateway.sh
user=cua
directory=/home/cua
environment=HOME="/home/cua",USER="cua",DISPLAY=":1",CUA_DRIVER_RS_TELEMETRY_ENABLED="0",PATH="/usr/local/bin:/usr/bin:/bin",NPM_CONFIG_CACHE="/home/cua/.npm",MCP_API_KEY="%(ENV_MCP_API_KEY)s",RAILWAY_ENVIRONMENT="%(ENV_RAILWAY_ENVIRONMENT)s",REQUIRE_MCP_API_KEY="%(ENV_REQUIRE_MCP_API_KEY)s",MCP_GATEWAY_PORT="%(ENV_MCP_GATEWAY_PORT)s",PORT="%(ENV_PORT)s"
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/var/log/supervisor/mcp-gateway.log
stderr_logfile=/var/log/supervisor/mcp-gateway.error.log
priority=50
