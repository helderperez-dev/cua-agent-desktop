[program:reavion-driver]
command=/usr/local/bin/start-reavion-driver.sh
user=reavion
directory=/home/reavion
environment=HOME="/home/reavion",USER="reavion",DISPLAY=":1",XAUTHORITY="/home/reavion/.Xauthority",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus",CUA_DRIVER_RS_TELEMETRY_ENABLED="0",REAVION_DRIVER_RS_TELEMETRY_ENABLED="0",REAVION_SOCKET="/run/user/1000/reavion.sock",REAVION_DRIVER="/usr/local/libexec/reavion-desktop/reavion-driver",CUA_SOCKET="/run/user/1000/reavion.sock",CUA_DRIVER="/usr/local/libexec/reavion-desktop/reavion-driver",PATH="/usr/local/bin:/usr/bin:/bin"
autorestart=true
startsecs=8
startretries=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=40
