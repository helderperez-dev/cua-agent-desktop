[program:reavion-driver]
command=/usr/local/bin/start-reavion-driver.sh
user=reavion
directory=/home/reavion
environment=HOME="/home/reavion",USER="reavion",DISPLAY=":1",CUA_DRIVER_RS_TELEMETRY_ENABLED="0",REAVION_DRIVER_RS_TELEMETRY_ENABLED="0",REAVION_SOCKET="/run/user/1000/reavion.sock",REAVION_DRIVER="/usr/local/libexec/reavion-desktop/reavion-driver",CUA_SOCKET="/run/user/1000/reavion.sock",CUA_DRIVER="/usr/local/libexec/reavion-desktop/reavion-driver"
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/var/log/supervisor/reavion-driver.log
stderr_logfile=/var/log/supervisor/reavion-driver.error.log
priority=40
