services:
  desktop:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DESKTOP_BASE: ${DESKTOP_BASE:-reavion/xfce:local}
        DRIVER_IMAGE: ${DRIVER_IMAGE:-localhost/reavion-driver:local}
        REAVION_DRIVER_VERSION: ${REAVION_DRIVER_VERSION:-main}
    image: localhost/reavion-desktop:local
    container_name: reavion-desktop
    mem_limit: 4g
    cpus: 2
    shm_size: 512m
    environment:
      VNC_PW: ${VNC_PW:-changeme}
      PORT: ${PORT:-8080}
      MCP_API_KEY: ${MCP_API_KEY:-}
      REQUIRE_MCP_API_KEY: ${REQUIRE_MCP_API_KEY:-0}
      MCP_GATEWAY_PORT: ${MCP_GATEWAY_PORT:-8200}
      VNC_RESOLUTION: ${VNC_RESOLUTION:-1280x720}
      VNC_COL_DEPTH: ${VNC_COL_DEPTH:-24}
      HOME: /home/reavion
      REAVION_SOCKET: /run/user/1000/reavion.sock
      REAVION_DRIVER: /usr/local/libexec/reavion-desktop/reavion-driver
      CUA_SOCKET: /run/user/1000/reavion.sock
      CUA_DRIVER: /usr/local/libexec/reavion-desktop/reavion-driver
      CUA_DRIVER_RS_TELEMETRY_ENABLED: "0"
      REAVION_DRIVER_RS_TELEMETRY_ENABLED: "0"
    ports:
      - "127.0.0.1:6080:8080"
    volumes:
      - ./workspace:/home/reavion/workspace
      - ./data/chrome-profile:/home/reavion/.config/google-chrome
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    ipc: private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
